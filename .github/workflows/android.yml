name: Build and verify Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate family grouping
        run: python3 tools/validate_catalog.py
      - name: Compile, test and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Hunter-Training-1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Hunter-Training-1.0.0.apk
          sha256sum dist/Hunter-Training-1.0.0.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hunter-Training-APK
          path: dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash tools/device-test.sh
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-verification
          path: |
            app/build/reports/
            dist/screenshots/
            dist/logcat.txt
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/Hunter-Training-1.0.0.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Hunter Training 1.0.0" --notes "APK instalable para Android 8.0 o posterior. Kotlin y XML; 100 familias de ejercicios, rutinas y progreso local. Compilación de prueba firmada con certificado de depuración. No es una firma de producción para Google Play. Verificación: pruebas unitarias, lint, firma y pruebas instrumentadas en Android."
